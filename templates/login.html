{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="card">
    <h2>Login</h2>

    <form method="POST" action="/login">

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>

    </form>

</div>

{% endblock %}
