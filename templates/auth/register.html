{% extends "base.html" %}

{% block title %}Register — Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header fw-bold">Register</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Register as</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="role" value="student" id="role_student"
                                    {% if request.form.get('role', 'student') == 'student' %}checked{% endif %} />
                                <label class="form-check-label" for="role_student">Student</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="role" value="company" id="role_company"
                                    {% if request.form.get('role') == 'company' %}checked{% endif %} />
                                <label class="form-check-label" for="role_company">Company</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control form-control-sm" name="email"
                               value="{{ request.form.get('email', '') }}" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control form-control-sm" name="password" required />
                    </div>

                    {% if request.form.get('role') != 'company' %}
                    <hr />
                    <div class="mb-2">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control form-control-sm" name="name"
                               value="{{ request.form.get('name', '') }}" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Roll Number</label>
                        <input type="text" class="form-control form-control-sm" name="roll_number"
                               value="{{ request.form.get('roll_number', '') }}" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control form-control-sm" name="department"
                               value="{{ request.form.get('department', '') }}" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">CGPA</label>
                        <input type="number" class="form-control form-control-sm" name="cgpa"
                               step="0.01" min="0" max="10" value="{{ request.form.get('cgpa', '') }}" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Skills</label>
                        <input type="text" class="form-control form-control-sm" name="skills"
                               placeholder="e.g. Python, SQL" value="{{ request.form.get('skills', '') }}" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Resume (PDF)</label>
                        <input type="file" class="form-control form-control-sm" name="resume" accept=".pdf" />
                    </div>
                    {% else %}
                    <hr />
                    <div class="mb-2">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control form-control-sm" name="company_name"
                               value="{{ request.form.get('company_name', '') }}" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">HR Contact Email</label>
                        <input type="email" class="form-control form-control-sm" name="hr_contact"
                               value="{{ request.form.get('hr_contact', '') }}" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Website</label>
                        <input type="url" class="form-control form-control-sm" name="website"
                               value="{{ request.form.get('website', '') }}" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control form-control-sm" name="description" rows="3">{{ request.form.get('description', '') }}</textarea>
                    </div>
                    <div class="alert alert-warning p-2 small mb-3">
                        Company accounts require admin approval before login.
                    </div>
                    {% endif %}

                    <button type="submit" class="btn btn-primary btn-sm w-100">Register</button>
                </form>
                <div class="text-center mt-3 small">
                    Already have an account? <a href="{{ url_for('login') }}">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
