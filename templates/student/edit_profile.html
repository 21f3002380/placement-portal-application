{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold mb-0">Edit Profile</h5>
    <a href="{{ url_for('student_dashboard') }}" class="btn btn-sm btn-secondary">back</a>
</div>
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('student_edit_profile') }}" enctype="multipart/form-data">
                    <div class="mb-2"><label class="form-label">Full Name</label>
                        <input type="text" class="form-control form-control-sm" name="name" value="{{ student.name }}" required /></div>
                    <div class="mb-2"><label class="form-label">Roll Number</label>
                        <input type="text" class="form-control form-control-sm" value="{{ student.roll_number }}" disabled /></div>
                    <div class="mb-2"><label class="form-label">Department</label>
                        <input type="text" class="form-control form-control-sm" name="department" value="{{ student.department or '' }}" /></div>
                    <div class="mb-2"><label class="form-label">CGPA</label>
                        <input type="number" class="form-control form-control-sm" name="cgpa" step="0.01" min="0" max="10" value="{{ student.cgpa or '' }}" /></div>
                    <div class="mb-2"><label class="form-label">Skills</label>
                        <input type="text" class="form-control form-control-sm" name="skills" value="{{ student.skills or '' }}" /></div>
                    <div class="mb-3"><label class="form-label">Resume (PDF)
                        {% if student.resume_filename %}<small class="text-muted">— current: {{ student.resume_filename }}</small>{% endif %}
                        </label>
                        <input type="file" class="form-control form-control-sm" name="resume" accept=".pdf" /></div>
                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
